name = "tingbook"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

# 本地开发（wrangler pages dev）使用的 KV 绑定。
# 生产环境请在 Cloudflare Dashboard → Pages → tingbook → Settings → Functions → KV namespace bindings
# 绑定一个名为 TINGBOOK_KV 的命名空间（绑定名必须与此一致）。
[[kv_namespaces]]
binding = "TINGBOOK_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
