# TTS Generate (GPU Runner)
# 在你自备的 GPU runner上，用 wuyongss 声纹（仓库内 listen-to-your-voice/ltyv_reference.wav）
# 通过 F5-TTS 真实语音克隆，一键生成全部 23 本有声书 +《葬花吟》并自动推回仓库，
# GitHub Pages 与 Cloudflare Pages（tingbook.pages.dev）随即重新发布「真正可朗读」的
# Listen To Your Voice 音频（Cloudflare 侧由 cloudflare-pages-deploy.yml 经 workflow_run 监听本工作流完成事件自动触发）。
name: TTS Generate (GPU Runner)

on:
  # 手动触发（可填 nfe_step 推理步数）
  workflow_dispatch:
    inputs:
      nfe_step:
        description: "F5-TTS 推理步数（越大越慢越稳，默认 32）"
        required: false
        default: "32"
  # 每周一 03:17 UTC 自动重生成（例如模型/参考音更新后保持同步）
  schedule:
    - cron: "17 3 * * 1"
  # 改了 tts/ 管线或参考音时自动重生成
  push:
    paths:
      - "tts/**"
      - "listen-to-your-voice/ltyv_reference.wav"

permissions:
  contents: write   # 推送用 secrets.GH_PAT；此处为 GITHUB_TOKEN 兜底

jobs:
  generate:
    # ↓↓↓ 改成你自备 GPU runner 的 label（在 runner 配置里看到的那些）↓↓↓
    runs-on: [self-hosted, gpu]
    timeout-minutes: 360
    # Windows self-hosted runner 默认 shell 是 PowerShell，本工作流步骤用的是 bash 语法
    # （pip、if/then/fi、$GITHUB_OUTPUT 重定向等），统一切到 Git Bash 执行。
    # 前置要求：runner 机器已安装 Git for Windows（自带 bash）。
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with push token)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CUDA torch + TTS deps
        run: |
          python -m pip install --upgrade pip
          # 显式安装 CUDA 版 torch/torchaudio（requirements.txt 里不含，避免拉到 CPU 版）
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu121
          pip install -r tts/requirements.txt

      - name: Download models (F5TTS via ModelScope; vocos vocoder 首次运行自动从 HF 拉取)
        run: python tts/download_models.py

      - name: Generate real cloned voice (23 books + 葬花吟)
        run: |
          python tts/generate_all.py \
            --ref listen-to-your-voice/ltyv_reference.wav \
            --nfe_step "${{ github.event.inputs.nfe_step || '32' }}"

      - name: Commit & push generated audio
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/ listen-to-your-voice/
          if git diff --cached --quiet; then
            echo "no audio changes; nothing to push"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(tts): regenerate real cloned voice via GPU runner"
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # 兜底同步：无论本工作流用的 GH_PAT 是否带 workflow 权限
      # （带权限时上面 push 已触发 cloudflare 部署；不带时则不会），
      # 这里都显式 dispatch 一次 cloudflare-pages-deploy，确保 tingbook.pages.dev 同步。
      # 与 cloudflare-pages-deploy.yml 的 workflow_run 触发器并存时最多多一次部署，
      # 其 concurrency 组会顺序执行，无害。
      - name: Sync Cloudflare Pages (fallback dispatch)
        if: ${{ steps.push.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cloudflare-pages-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "dispatched Cloudflare Pages deploy"
