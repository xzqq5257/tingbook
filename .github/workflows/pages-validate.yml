# Pages Deploy Validation
# 在每次 push 到 main 后，等待 GitHub Pages 构建完成，并校验
# 「wuyongss 音色试听」模块（wuyongss/ 下的音频）已正确上线、可访问、未被截断；
# 同时确认 23 本有声书已用 wuyongss 声纹重新朗读并覆盖上线。
name: Pages Deploy Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

# 仅访问公开的 Pages URL，无需任何仓库写权限
permissions: {}

concurrency:
  group: pages-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for GitHub Pages build
        run: |
          # legacy Pages 构建通常 1-3 分钟；轮询直到站点可达
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -I "https://xzqq5257.github.io/tingbook/" || true)
            if [ "$code" = "200" ]; then
              echo "site reachable (attempt $i, http=$code)"; break
            fi
            echo "waiting for build (http=$code) attempt $i"; sleep 10
          done

      - name: Validate wuyongss audition module is live
        run: |
          set -e
          BASE="https://xzqq5257.github.io/tingbook"
          fail=0

          # 1) 页面包含 wuyongss 试听入口
          html=$(curl -fsSL "$BASE/")
          echo "$html" | grep -q "wuyongss 音色试听" || { echo "MISSING: wuyongss 音色试听 section"; fail=1; }
          echo "$html" | grep -q "wuyongss_read_zanghuayin" || { echo "MISSING: wuyongss_read_zanghuayin reference"; fail=1; }

          # 2) wuyongss 音频均可达，且葬花吟为完整大文件（>4MB，防 CDN 截断）
          for f in wuyongss_demo_hum.mp3 wuyongss_demo_sing.mp3 wuyongss_read_zanghuayin.wav; do
            out=$(curl -s -o /dev/null -w "http=%{http_code} size=%{size_download}" "$BASE/wuyongss/$f")
            echo "$f -> $out"
            code=${out#http=}; code=${code%% *}
            sz=${out#*size=}
            if [ "$code" != "200" ] || [ "${sz:-0}" -lt 100000 ]; then
              echo "FAIL: $f not served correctly ($out)"; fail=1
            fi
          done

          # 3) 葬花吟必须完整（110s @ 16bit/22.05k ≈ 4.85MB，阈值 4MB 防截断）
          zout=$(curl -s -o /dev/null -w "%{size_download}" "$BASE/wuyongss/wuyongss_read_zanghuayin.wav")
          echo "wuyongss_read_zanghuayin.wav size = $zout bytes"
          if [ "${zout:-0}" -lt 4000000 ]; then
            echo "FAIL: wuyongss_read_zanghuayin.wav appears truncated ($zout bytes)"; fail=1
          fi

          # 4) 确认 23 本有声书已用 wuyongss 声纹覆盖上线（抽样若干本）
          for b in "%E5%87%BA%E5%B8%88%E8%A1%A8.mp3" "%E6%B4%9B%E7%A5%9E%E8%B5%8B.mp3" "%E9%95%BF%E6%86%A8%E6%AD%8C.mp3"; do
            out=$(curl -s -o /dev/null -w "http=%{http_code} size=%{size_download}" "$BASE/audio/$b")
            echo "book $b -> $out"
            code=${out#http=}; code=${code%% *}
            sz=${out#*size=}
            if [ "$code" != "200" ] || [ "${sz:-0}" -lt 50000 ]; then
              echo "FAIL: book $b not served correctly ($out)"; fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "=== PAGES VALIDATION FAILED ==="
            exit 1
          fi
          echo "=== PAGES VALIDATION PASSED (wuyongss/ module is live) ==="
