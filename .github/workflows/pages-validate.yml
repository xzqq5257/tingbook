# Pages Deploy Validation
# 在每次 push 到 main 后，等待 GitHub Pages 构建完成，并校验
# 「Listen To Your Voice」模块（listen-to-your-voice/ 下的音频）已正确上线、可访问、未被截断；
# 同时确认 23 本有声书已用 wuyongss 声纹（真实语音克隆）重新朗读并覆盖上线。
name: Pages Deploy Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

# 仅访问公开的 Pages URL，无需任何仓库写权限
permissions: {}

concurrency:
  group: pages-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for GitHub Pages build
        run: |
          # legacy Pages 构建通常 1-3 分钟；轮询直到站点可达
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -I "https://xzqq5257.github.io/tingbook/" || true)
            if [ "$code" = "200" ]; then
              echo "site reachable (attempt $i, http=$code)"; break
            fi
            echo "waiting for build (http=$code) attempt $i"; sleep 10
          done

      - name: Validate Listen To Your Voice audition module is live
        run: |
          set -e
          BASE="https://xzqq5257.github.io/tingbook"
          fail=0

          # 1) 页面包含 Listen To Your Voice 试听入口
          html=$(curl -fsSL "$BASE/")
          echo "$html" | grep -q "Listen To Your Voice" || { echo "MISSING: Listen To Your Voice section"; fail=1; }
          echo "$html" | grep -q "ltyv_read_zanghuayin" || { echo "MISSING: ltyv_read_zanghuayin reference"; fail=1; }

          # 2) 真实语音克隆音频均可达：原声试听(~1.1MB) + 葬花吟朗读(>4MB，防 CDN 截断)
          for f in ltyv_reference.wav ltyv_read_zanghuayin.wav; do
            out=$(curl -s -o /dev/null -w "http=%{http_code} size=%{size_download}" "$BASE/listen-to-your-voice/$f")
            echo "$f -> $out"
            code=${out#http=}; code=${code%% *}
            sz=${out#*size=}
            min=100000
            if [ "$f" = "ltyv_read_zanghuayin.wav" ]; then min=4000000; fi
            if [ "$code" != "200" ] || [ "${sz:-0}" -lt "$min" ]; then
              echo "FAIL: $f not served correctly ($out)"; fail=1
            fi
          done

          # 3) 葬花吟必须完整（真实克隆 ~110s，阈值 4MB 防截断）
          zout=$(curl -s -o /dev/null -w "%{size_download}" "$BASE/listen-to-your-voice/ltyv_read_zanghuayin.wav")
          echo "ltyv_read_zanghuayin.wav size = $zout bytes"
          if [ "${zout:-0}" -lt 4000000 ]; then
            echo "FAIL: ltyv_read_zanghuayin.wav appears truncated ($zout bytes)"; fail=1
          fi

          # 4) 确认 23 本有声书已用 wuyongss 声纹（真实语音克隆）覆盖上线（抽 3 本；
          #    用 python 做正确的百分号编码，避免中文文件名编码错位导致 404）
          books=("出师表.mp3" "洛神赋.mp3" "长恨歌.mp3")
          for b in "${books[@]}"; do
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$b")
            out=$(curl -s -o /dev/null -w "http=%{http_code} size=%{size_download}" "$BASE/audio/$enc")
            echo "book $b ($enc) -> $out"
            code=${out#http=}; code=${code%% *}
            sz=${out#*size=}
            if [ "$code" != "200" ] || [ "${sz:-0}" -lt 50000 ]; then
              echo "FAIL: book $b not served correctly ($out)"; fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "=== PAGES VALIDATION FAILED ==="
            exit 1
          fi
          echo "=== PAGES VALIDATION PASSED (Listen To Your Voice module is live) ==="
