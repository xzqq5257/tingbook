<title>倾听你的声音</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--fg:#e8eaed;--muted:#9aa3b2;--accent:#7c5cff;--accent2:#3ddc97}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--fg);line-height:1.6;padding:0;padding-bottom:120px}
  .cover{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .cover-art{position:relative;padding:34px 20px 30px;
    background:
      radial-gradient(140% 120% at 82% -20%, rgba(124,92,255,.55), transparent 55%),
      radial-gradient(120% 120% at -10% 120%, rgba(61,220,151,.42), transparent 55%),
      linear-gradient(135deg,#171b25,#0f1115);}
  .cover-art::after{content:"";position:absolute;inset:0;
    background:radial-gradient(60% 60% at 50% 0%, rgba(255,255,255,.06), transparent 70%);pointer-events:none}
  .wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:72px;opacity:.55}
  .cover-head{position:relative;z-index:2;max-width:560px}
  .cover-kicker{font-size:12px;color:var(--accent2);letter-spacing:.14em;margin-bottom:8px;font-weight:600}
  .cover h1{font-size:32px;line-height:1.15;margin:0 0 8px;font-weight:800;
    background:linear-gradient(92deg,#ffffff 10%,#cfc6ff 60%,#a6f3d3 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .cover-sub{margin:0;color:var(--muted);font-size:13.5px}
  .cover-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .cover-tags span{font-size:11px;color:#cdd3e0;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:4px 11px}
  .lib-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 14px 4px}
  .lib-bar button{padding:9px 16px;font-size:14px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
  .lib-bar button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .playing-all{color:var(--accent2);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 14px}
  .card.playing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .title{font-weight:600;font-size:15px}
  .meta{color:var(--muted);font-size:12px}
  button.play-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  .badge{background:#2a2f3a;border-radius:6px;padding:6px 10px;font-size:11px;color:var(--muted);
    text-decoration:none;display:inline-block;margin-left:6px;cursor:pointer}
  #player{position:fixed;left:0;right:0;bottom:0;background:#11141a;border-top:1px solid var(--line);
    padding:10px 14px;display:none;flex-direction:column;gap:8px;z-index:40}
  #player .pl-top{display:flex;align-items:center;gap:12px}
  #player-now{font-size:13px;color:var(--muted);max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:0 0 auto}
  #player audio{flex:1;min-width:140px;margin:0}
  #player .pl-ctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  #player .pl-ctrl select{background:#1a1d24;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:13px}
  #timer-label{color:var(--accent2);min-width:56px;font-variant-numeric:tabular-nums}
  #subtitle{display:none;max-height:96px;overflow-y:auto;font-size:15px;background:#0b0d12;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  #subtitle .sent{display:block;padding:3px 6px;border-radius:6px;color:#c4c9d4;cursor:pointer;transition:.15s}
  #subtitle .sent.active{background:var(--accent);color:#fff;font-weight:600}
  #resume-card{display:none;border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2) inset;margin:10px 14px}
  #resume-bar{position:fixed;left:0;right:0;bottom:0;background:#1a1d24;border-top:2px solid var(--accent2);
    padding:10px 16px;display:none;align-items:center;gap:12px;z-index:60;box-shadow:0 -4px 16px rgba(0,0,0,.4)}
  #resume-bar .rb-title{font-size:14px;font-weight:600;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #resume-bar .rb-title small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  #resume-bar button.go{background:var(--accent2);color:#06281c;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:600}
  #resume-bar button.rb-close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
  .hint{color:var(--muted);font-size:12px;margin:4px 14px 6px}
</style>
</head>

<script>
const BOOKS = [{"title": "出师表", "duration": 197, "text": "臣亮言：先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。\n宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。\n侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。\n亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。\n臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。\n先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。\n愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎；陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏，臣不胜受恩感激。\n今当远离，临表涕零，不知所言。", "file": "audio/出师表.mp3"}, {"title": "声声慢", "duration": 34, "text": "寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急？雁过也，正伤心，却是旧时相识。\n满地黄花堆积，憔悴损，如今有谁堪摘？守着窗儿，独自怎生得黑？梧桐更兼细雨，到黄昏、点点滴滴。这次第，怎一个愁字了得！", "file": "audio/声声慢.mp3"}, {"title": "将进酒", "duration": 58, "text": "君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。人生得意须尽欢，莫使金樽空对月。天生我材必有用，千金散尽还复来。烹羊宰牛且为乐，会须一饮三百杯。\n岑夫子，丹丘生，将进酒，杯莫停。与君歌一曲，请君为我倾耳听。钟鼓馔玉不足贵，但愿长醉不愿醒。古来圣贤皆寂寞，惟有饮者留其名。陈王昔时宴平乐，斗酒十千恣欢谑。主人何为言少钱，径须沽取对君酌。五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。", "file": "audio/将进酒.mp3"}, {"title": "岳阳楼记", "duration": 118, "text": "庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。属予作文以记之。\n予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？\n若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空；日星隐曜，山岳潜形；商旅不行，樯倾楫摧；薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。\n至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。\n嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰“先天下之忧而忧，后天下之乐而乐”乎！噫！微斯人，吾谁与归？\n时六年九月十五日。", "file": "audio/岳阳楼记.mp3"}, {"title": "师说", "duration": 164, "text": "古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。\n嗟乎！师道之不传也久矣！欲人之无惑也难矣！古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。是故圣益圣，愚益愚。圣人之所以为圣，愚人之所以为愚，其皆出于此乎？爱其子，择师而教之；于其身也，则耻师焉，惑矣。彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。巫医乐师百工之人，不耻相师。士大夫之族，曰师曰弟子云者，则群聚而笑之。问之，则曰：“彼与彼年相若也，道相似也。位卑则足羞，官盛则近谀。”呜呼！师道之不复，可知矣。巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！\n圣人无常师。孔子师郯子、苌弘、师襄、老聃。郯子之徒，其贤不及孔子。孔子曰：三人行，则必有我师。是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。\n李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。余嘉其能行古道，作《师说》以贻之。", "file": "audio/师说.mp3"}, {"title": "念奴娇赤壁怀古", "duration": 35, "text": "大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。\n遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞烟灭。故国神游，多情应笑我，早生华发。人生如梦，一尊还酹江月。", "file": "audio/念奴娇赤壁怀古.mp3"}, {"title": "春江花月夜", "duration": 85, "text": "春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明。\n江流宛转绕芳甸，月照花林皆似霰。空里流霜不觉飞，汀上白沙看不见。\n江天一色无纤尘，皎皎空中孤月轮。江畔何人初见月？江月何年初照人？\n人生代代无穷已，江月年年望相似。不知江月待何人，但见长江送流水。\n白云一片去悠悠，青枫浦上不胜愁。谁家今夜扁舟子？何处相思明月楼？\n可怜楼上月徘徊，应照离人妆镜台。玉户帘中卷不去，捣衣砧上拂还来。\n此时相望不相闻，愿逐月华流照君。鸿雁长飞光不度，鱼龙潜跃水成文。\n昨夜闲潭梦落花，可怜春半不还家。江水流春去欲尽，江潭落月复西斜。\n斜月沉沉藏海雾，碣石潇湘无限路。不知乘月几人归，落月摇情满江树。", "file": "audio/春江花月夜.mp3"}, {"title": "木兰诗", "duration": 114, "text": "唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。\n问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。\n东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。旦辞爷娘去，暮宿黄河边，不闻爷娘唤女声，但闻黄河流水鸣溅溅。旦辞黄河去，暮至黑山头，不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。\n万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。\n归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。\n爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻妹来，磨刀霍霍向猪羊。开我东阁门，坐我西阁床，脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。\n雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？", "file": "audio/木兰诗.mp3"}, {"title": "桃花源记", "duration": 113, "text": "晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。\n林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田美池桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。\n见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：不足为外人道也。\n既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。\n南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。", "file": "audio/桃花源记.mp3"}, {"title": "水调歌头", "duration": 31, "text": "明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。\n转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。", "file": "audio/水调歌头.mp3"}, {"title": "沁园春长沙", "duration": 40, "text": "独立寒秋，湘江北去，橘子洲头。看万山红遍，层林尽染；漫江碧透，百舸争流。鹰击长空，鱼翔浅底，万类霜天竞自由。怅寥廓，问苍茫大地，谁主沉浮？\n携来百侣曾游，忆往昔峥嵘岁月稠。恰同学少年，风华正茂；书生意气，挥斥方遒。指点江山，激扬文字，粪土当年万户侯。曾记否，到中流击水，浪遏飞舟？", "file": "audio/沁园春长沙.mp3"}, {"title": "沁园春雪", "duration": 40, "text": "北国风光，千里冰封，万里雪飘。望长城内外，惟余莽莽；大河上下，顿失滔滔。山舞银蛇，原驰蜡象，欲与天公试比高。须晴日，看红装素裹，分外妖娆。\n江山如此多娇，引无数英雄竞折腰。惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。一代天骄，成吉思汗，只识弯弓射大雕。俱往矣，数风流人物，还看今朝。", "file": "audio/沁园春雪.mp3"}, {"title": "洛神赋", "duration": 332, "text": "黄初三年，余朝京师，还济洛川。古人有言，斯水之神，名曰宓妃。感宋玉对楚王神女之事，遂作斯赋。其辞曰：\n余从京域，言归东藩。背伊阙，越轘辕，经通谷，陵景山。日既西倾，车殆马烦。尔乃税驾乎蘅皋，秣驷乎芝田，容与乎阳林，流眄乎洛川。于是精移神骇，忽焉思散。俯则未察，仰以殊观。睹一丽人，于岩之畔。乃援御者而告之曰：尔有觌于彼者乎？彼何人斯，若此之艳也！御者对曰：臣闻河洛之神，名曰宓妃。然则君王之所见，无乃是乎？其状若何？臣愿闻之。\n余告之曰：其形也，翩若惊鸿，婉若游龙。荣曜秋菊，华茂春松。仿佛兮若轻云之蔽月，飘飖兮若流风之回雪。远而望之，皎若太阳升朝霞；迫而察之，灼若芙蕖出渌波。秾纤得衷，修短合度。肩若削成，腰如约素。延颈秀项，皓质呈露。芳泽无加，铅华弗御。云髻峨峨，修眉联娟。丹唇外朗，皓齿内鲜。明眸善睐，靥辅承权。瑰姿艳逸，仪静体闲。柔情绰态，媚于语言。奇服旷世，骨像应图。披罗衣之璀粲兮，珥瑶碧之华琚。戴金翠之首饰，缀明珠以耀躯。践远游之文履，曳雾绡之轻裾。微幽兰之芳蔼兮，步踟蹰于山隅。\n于是忽焉纵体，以遨以嬉。左倚采旄，右荫桂旗。攘皓腕于神浒兮，采湍濑之玄芝。余情悦其淑美兮，心振荡而不怡。无良媒以接欢兮，托微波而通辞。愿诚素之先达兮，解玉佩以要之。嗟佳人之信修兮，羌习礼而明诗。抗琼珶以和予兮，指潜渊而为期。执眷眷之款实兮，惧斯灵之我欺。感交甫之弃言兮，怅犹豫而狐疑。收和颜而静志兮，申礼防以自持。\n于是洛灵感焉，徙倚彷徨。神光离合，乍阴乍阳。竦轻躯以鹤立，若将飞而未翔。践椒涂之郁烈，步蘅薄而流芳。超长吟以永慕兮，声哀厉而弥长。\n尔乃众灵杂沓，命俦啸侣。或戏清流，或翔神渚。或采明珠，或拾翠羽。从南湘之二妃，携汉滨之游女。叹匏瓜之无匹兮，咏牵牛之独处。扬轻袂之绮靡兮，翳修袖以延伫。体迅飞凫，飘忽若神。凌波微步，罗袜生尘。动无常则，若危若安。进止难期，若往若还。转眄流精，光润玉颜。含辞未吐，气若幽兰。华容婀娜，令我忘餐。\n于是屏翳收风，川后静波。冯夷鸣鼓，女娲清歌。腾文鱼以警乘，鸣玉鸾以偕逝。六龙俨其齐首，载云车之容裔。鲸鲵踊而夹毂，水禽翔而为卫。\n于是越北沚，过南冈。纡素领，回清阳。动朱唇以徐言，陈交接之大纲。恨人神之道殊兮，怨盛年之莫当。抗罗袂以掩涕兮，泪流襟之浪浪。悼良会之永绝兮，哀一逝而异乡。无微情以效爱兮，献江南之明珰。虽潜处于太阴，长寄心于君王。忽不悟其所舍，怅神宵而蔽光。\n于是背下陵高，足往神留。遗情想像，顾望怀愁。冀灵体之复形，御轻舟而上溯。浮长川而忘反，思绵绵而增慕。夜耿耿而不寐，沾繁霜而至曙。命仆夫而就驾，吾将归乎东路。揽騑辔以抗策，怅盘桓而不能去。", "file": "audio/洛神赋.mp3"}, {"title": "滕王阁序", "duration": 256, "text": "豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。雄州雾列，俊采星驰。台隍枕夷夏之交，宾主尽东南之美。都督阎公之雅望，棨戟遥临；宇文新州之懿范，襜帷暂驻。十旬休假，胜友如云；千里逢迎，高朋满座。腾蛟起凤，孟学士之词宗；紫电青霜，王将军之武库。家君作宰，路出名区；童子何知，躬逢胜饯。\n时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿。临帝子之长洲，得天人之旧馆。层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。\n披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰迷津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。\n遥襟甫畅，逸兴遄飞。爽籁发而清风生，纤歌凝而白云遏。睢园绿竹，气凌彭泽之樽；邺水朱华，光照临川之笔。四美具，二难并。穷睇眄于中天，极娱游于暇日。天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。望长安于日下，目吴会于云间。地势极而南溟深，天柱高而北辰远。关山难越，谁悲失路之人？萍水相逢，尽是他乡之客。怀帝阍而不见，奉宣室以何年？\n嗟乎！时运不齐，命途多舛。冯唐易老，李广难封。屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？所赖君子见机，达人知命。老当益壮，宁移白首之心？穷且益坚，不坠青云之志。酌贪泉而觉爽，处涸辙以犹欢。北海虽赊，扶摇可接；东隅已逝，桑榆非晚。孟尝高洁，空余报国之情；阮籍猖狂，岂效穷途之哭！\n勃，三尺微命，一介书生。无路请缨，等终军之弱冠；有怀投笔，慕宗悫之长风。舍簪笏于百龄，奉晨昏于万里。非谢家之宝树，接孟氏之芳邻。他日趋庭，叨陪鲤对；今兹捧袂，喜托龙门。杨意不逢，抚凌云而自惜；钟期既遇，奏流水以何惭？\n呜呼！胜地不常，盛筵难再；兰亭已矣，梓泽丘墟。临别赠言，幸承恩于伟饯；登高作赋，是所望于群公。敢竭鄙怀，恭疏短引；一言均赋，四韵俱成。请洒潘江，各倾陆海云尔。\n滕王高阁临江渚，佩玉鸣鸾罢歌舞。画栋朝飞南浦云，珠帘暮卷西山雨。闲云潭影日悠悠，物换星移几度秋。阁中帝子今何在？槛外长江空自流。", "file": "audio/滕王阁序.mp3"}, {"title": "琵琶行", "duration": 214, "text": "浔阳江头夜送客，枫叶荻花秋瑟瑟。主人下马客在船，举酒欲饮无管弦。醉不成欢惨将别，别时茫茫江浸月。\n忽闻水上琵琶声，主人忘归客不发。寻声暗问弹者谁，琵琶声停欲语迟。移船相近邀相见，添酒回灯重开宴。千呼万唤始出来，犹抱琵琶半遮面。转轴拨弦三两声，未成曲调先有情。弦弦掩抑声声思，似诉平生不得志。低眉信手续续弹，说尽心中无限事。轻拢慢捻抹复挑，初为《霓裳》后《六幺》。大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘。间关莺语花底滑，幽咽泉流冰下难。冰泉冷涩弦凝绝，凝绝不通声暂歇。别有幽愁暗恨生，此时无声胜有声。银瓶乍破水浆迸，铁骑突出刀枪鸣。曲终收拨当心画，四弦一声如裂帛。东船西舫悄无言，唯见江心秋月白。\n沉吟放拨插弦中，整顿衣裳起敛容。自言本是京城女，家在虾蟆陵下住。十三学得琵琶成，名属教坊第一部。曲罢曾教善才服，妆成每被秋娘妒。五陵年少争缠头，一曲红绡不知数。钿头银篦击节碎，血色罗裙翻酒污。今年欢笑复明年，秋月春风等闲度。弟走从军阿姨死，暮去朝来颜色故。门前冷落鞍马稀，老大嫁作商人妇。商人重利轻别离，前月浮梁买茶去。去来江口守空船，绕船月明江水寒。夜深忽梦少年事，梦啼妆泪红阑干。\n我闻琵琶已叹息，又闻此语重唧唧。同是天涯沦落人，相逢何必曾相识！我从去年辞帝京，谪居卧病浔阳城。浔阳地僻无音乐，终岁不闻丝竹声。住近湓江地低湿，黄芦苦竹绕宅生。其间旦暮闻何物？杜鹃啼血猿哀鸣。春江花朝秋月夜，往往取酒还独倾。岂无山歌与村笛？呕哑嘲哳难为听。今夜闻君琵琶语，如听仙乐耳暂明。莫辞更坐弹一曲，为君翻作《琵琶行》。\n感我此言良久立，却坐促弦弦转急。凄凄不似向前声，满座重闻皆掩泣。座中泣下谁最多？江州司马青衫湿。", "file": "audio/琵琶行.mp3"}, {"title": "白头吟", "duration": 25, "text": "皑如山上雪，皎若云间月。闻君有两意，故来相决绝。\n今日斗酒会，明旦沟水头。躞蹀御沟上，沟水东西流。\n凄凄复凄凄，嫁娶不须啼。愿得一心人，白头不相离。\n竹竿何袅袅，鱼尾何簁簁。男儿重意气，何用钱刀为？", "file": "audio/白头吟.mp3"}, {"title": "蜀道难", "duration": 102, "text": "噫吁嚱，危乎高哉！蜀道之难，难于上青天！蚕丛及鱼凫，开国何茫然！尔来四万八千岁，不与秦塞通人烟。西当太白有鸟道，可以横绝峨眉巅。地崩山摧壮士死，然后天梯石栈相钩连。\n上有六龙回日之高标，下有冲波逆折之回川。黄鹤之飞尚不得过，猿猱欲度愁攀援。青泥何盘盘，百步九折萦岩峦。扪参历井仰胁息，以手抚膺坐长叹。\n问君西游何时还？畏途巉岩不可攀。但见悲鸟号古木，雄飞雌从绕林间。又闻子规啼夜月，愁空山。蜀道之难，难于上青天，使人听此凋朱颜！\n连峰去天不盈尺，枯松倒挂倚绝壁。飞湍瀑流争喧豗，砯崖转石万壑雷。其险也如此，嗟尔远道之人胡为乎来哉！\n剑阁峥嵘而崔嵬，一夫当关，万夫莫开。所守或匪亲，化为狼与豺。朝避猛虎，夕避长蛇，磨牙吮血，杀人如麻。锦城虽云乐，不如早还家。蜀道之难，难于上青天，侧身西望长咨嗟！", "file": "audio/蜀道难.mp3"}, {"title": "赤壁赋", "duration": 173, "text": "壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。\n于是饮酒乐甚，扣舷而歌之。歌曰：“桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。”客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。\n苏子愀然，正襟危坐而问客曰：“何为其然也？”客曰：“‘月明星稀，乌鹊南飞’，此非曹孟德之诗乎？西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。”\n苏子曰：“客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。是造物者之无尽藏也，而吾与子之所共适。”\n客喜而笑，洗盏更酌。肴核既尽，杯盘狼籍。相与枕藉乎舟中，不知东方之既白。", "file": "audio/赤壁赋.mp3"}, {"title": "过秦论", "duration": 261, "text": "秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。当是时也，商君佐之，内立法度，务耕织，修守战之具；外连衡而斗诸侯。于是秦人拱手而取西河之外。\n孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。于是六国之士，有宁越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。尝以十倍之地，百万之师，叩关而攻秦。秦人开关延敌，九国之师，逡巡而不敢进。秦无亡矢遗镞之费，而天下诸侯已困矣。于是从散约败，争割地而赂秦。秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹；因利乘便，宰割天下，分裂山河。强国请服，弱国入朝。延及孝文王、庄襄王，享国之日浅，国家无事。\n及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。乃使蒙恬北筑长城而守藩篱，却匈奴七百余里。胡人不敢南下而牧马，士不敢弯弓而报怨。于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰，收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。良将劲弩守要害之处，信臣精卒陈利兵而谁何。天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。\n始皇既没，余威震于殊俗。然陈涉瓮牖绳枢之子，甿隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富；蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦；斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。山东豪俊遂并起而亡秦族矣。\n且夫天下非小弱也，雍州之地，崤函之固，自若也。陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄耰棘矜，非铦于钩戟长铩也；谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及向时之士也。然而成败异变，功业相反，何也？试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。", "file": "audio/过秦论.mp3"}, {"title": "错误_郑愁予", "duration": 28, "text": "我打江南走过\n那等在季节里的容颜如莲花的开落\n东风不来，三月的柳絮不飞\n你的心如小小的寂寞的城\n恰若青石的街道向晚\n跫音不响，三月的春帷不揭\n你的心是小小的窗扉紧掩\n我达达的马蹄是美丽的错误\n我不是归人，是个过客", "file": "audio/错误_郑愁予.mp3"}, {"title": "长恨歌", "duration": 278, "text": "汉皇重色思倾国，御宇多年求不得。杨家有女初长成，养在深闺人未识。天生丽质难自弃，一朝选在君王侧。回眸一笑百媚生，六宫粉黛无颜色。\n春寒赐浴华清池，温泉水滑洗凝脂。侍儿扶起娇无力，始是新承恩泽时。云鬓花颜金步摇，芙蓉帐暖度春宵。春宵苦短日高起，从此君王不早朝。\n承欢侍宴无闲暇，春从春游夜专夜。后宫佳丽三千人，三千宠爱在一身。金屋妆成娇侍夜，玉楼宴罢醉和春。姊妹弟兄皆列土，可怜光彩生门户。遂令天下父母心，不重生男重生女。\n骊宫高处入青云，仙乐风飘处处闻。缓歌慢舞凝丝竹，尽日君王看不足。渔阳鼙鼓动地来，惊破霓裳羽衣曲。\n九重城阙烟尘生，千乘万骑西南行。翠华摇摇行复止，西出都门百余里。六军不发无奈何，宛转蛾眉马前死。花钿委地无人收，翠翘金雀玉搔头。君王掩面救不得，回看血泪相和流。\n黄埃散漫风萧索，云栈萦纡登剑阁。峨嵋山下少人行，旌旗无光日色薄。蜀江水碧蜀山青，圣主朝朝暮暮情。行宫见月伤心色，夜雨闻铃肠断声。\n天旋地转回龙驭，到此踌躇不能去。马嵬坡下泥土中，不见玉颜空死处。君臣相顾尽沾衣，东望都门信马归。\n归来池苑皆依旧，太液芙蓉未央柳。芙蓉如面柳如眉，对此如何不泪垂。春风桃李花开日，秋雨梧桐叶落时。西宫南内多秋草，落叶满阶红不扫。梨园弟子白发新，椒房阿监青娥老。夕殿萤飞思悄然，孤灯挑尽未成眠。迟迟钟鼓初长夜，耿耿星河欲曙天。鸳鸯瓦冷霜华重，翡翠衾寒谁与共。悠悠生死别经年，魂魄不曾来入梦。\n临邛道士鸿都客，能以精诚致魂魄。为感君王辗转思，遂教方士殷勤觅。排空驭气奔如电，升天入地求之遍。上穷碧落下黄泉，两处茫茫皆不见。忽闻海上有仙山，山在虚无缥缈间。楼阁玲珑五云起，其中绰约多仙子。中有一人字太真，雪肤花貌参差是。\n金阙西厢叩玉扃，转教小玉报双成。闻道汉家天子使，九华帐里梦魂惊。揽衣推枕起徘徊，珠箔银屏迤逦开。云鬓半偏新睡觉，花冠不整下堂来。风吹仙袂飘飘举，犹似霓裳羽衣舞。玉容寂寞泪阑干，梨花一枝春带雨。\n含情凝睇谢君王，一别音容两渺茫。昭阳殿里恩爱绝，蓬莱宫中日月长。回头下望人寰处，不见长安见尘雾。惟将旧物表深情，钿合金钗寄将去。钗留一股合一扇，钗擘黄金合分钿。但教心似金钿坚，天上人间会相见。\n临别殷勤重寄词，词中有誓两心知。七月七日长生殿，夜半无人私语时。在天愿作比翼鸟，在地愿为连理枝。天长地久有时尽，此恨绵绵无绝期。", "file": "audio/长恨歌.mp3"}, {"title": "阿房宫赋", "duration": 159, "text": "六王毕，四海一，蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。\n妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦。朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉。有不见者，三十六年。\n燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。\n嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家。奈何取之尽锱铢，用之如泥沙？使负栋之柱，多于南亩之农夫；架梁之椽，多于机上之工女；钉头磷磷，多于在庾之粟粒；瓦缝参差，多于周身之帛缕；直栏横槛，多于九土之城郭；管弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！\n呜呼！灭六国者六国也，非秦也；族秦者秦也，非天下也。嗟夫！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。", "file": "audio/阿房宫赋.mp3"}];
const listEl = document.getElementById('list');
const player = document.getElementById('player');
const audio = document.getElementById('audio');
const playerNow = document.getElementById('player-now');
const subtitleEl = document.getElementById('subtitle');
const resumeBar = document.getElementById('resume-bar');

let playlist = [], plIndex = -1, playingAll = false;
let curSentences = [], curMarks = null, curActive = -1;
const PROGRESS_KEY = 'tingbook_progress_v1';
const SPEED_KEY = 'tingbook_speed_v1';
let currentPlay = { file:'', name:'', text:'', playlist:null, index:-1 };
let lastSave = 0;
let sleepTimer = null, sleepInterval = null, sleepEnd = 0;

function fmtTime(s){ s=Math.max(0,Math.floor(s||0)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }

const _idb = (function(){
  let dbp = null;
  function open(){ if(dbp) return dbp; dbp = new Promise((res)=>{
    try{ const r = indexedDB.open('tingbook_db', 1);
      r.onupgradeneeded = ()=>{ try{ r.result.createObjectStore('kv'); }catch(e){} };
      r.onsuccess = ()=>res(r.result); r.onerror = ()=>res(null);
    }catch(e){ res(null); } }); return dbp; }
  return {
    async set(k,v){ const db=await open(); if(!db) return; try{ db.transaction('kv','readwrite').objectStore('kv').put(v,k); }catch(e){} },
    async get(k){ const db=await open(); if(!db) return null; return await new Promise((res)=>{ try{ const r=db.transaction('kv','readonly').objectStore('kv').get(k); r.onsuccess=()=>res(r.result??null); r.onerror=()=>res(null); }catch(e){ res(null); } }); }
  };
})();
async function saveProgress(){
  if(!currentPlay.file) return;
  const pl = (currentPlay.playlist && currentPlay.playlist.length) ? currentPlay.playlist.map(x=>BOOKS.indexOf(x)) : null;
  const data = JSON.stringify({ file:currentPlay.file, name:currentPlay.name, text:currentPlay.text,
    time:audio.currentTime||0, duration:audio.duration||0, playlist:pl, index:currentPlay.index, ts:Date.now() });
  try{ localStorage.setItem(PROGRESS_KEY, data); }catch(e){}
  await _idb.set(PROGRESS_KEY, data);
}
async function loadProgress(){
  try{ const v = localStorage.getItem(PROGRESS_KEY); if(v) return JSON.parse(v); }catch(e){}
  const v = await _idb.get(PROGRESS_KEY);
  if(v){ try{ return JSON.parse(v); }catch(e){ return null; } }
  return null;
}
async function clearProgress(){
  try{ localStorage.removeItem(PROGRESS_KEY); }catch(e){}
  await _idb.set(PROGRESS_KEY, null);
}
function applySpeed(){
  const v = parseFloat(document.getElementById('speed').value) || 1;
  audio.playbackRate = v;
  try{ localStorage.setItem(SPEED_KEY, String(v)); }catch(e){}
}
function setSleep(min){
  clearTimeout(sleepTimer); clearInterval(sleepInterval);
  const lbl = document.getElementById('timer-label');
  if(!min){ lbl.textContent=''; return; }
  sleepEnd = Date.now() + min*60000;
  sleepTimer = setTimeout(()=>{ audio.pause(); lbl.textContent='已关闭'; document.getElementById('timer').value='0';
    setTimeout(()=>lbl.textContent='',1500); }, min*60000);
  sleepInterval = setInterval(()=>{
    const left = Math.max(0, sleepEnd - Date.now());
    const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
    lbl.textContent = '剩 '+m+':'+String(s).padStart(2,'0');
  }, 1000);
}

function showResume(prog){
  const card=document.getElementById('resume-card');
  const valid = prog && prog.file && prog.time>=3;
  if(!valid){ card.style.display='none'; resumeBar.style.display='none';
    document.getElementById('resume-from-player').style.display='none'; return; }
  const name = (prog.playlist && prog.playlist[prog.index]) ? prog.playlist[prog.index].name : prog.name;
  const when = prog.ts ? new Date(prog.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  card.style.display='';
  document.getElementById('resume-title').textContent='继续播放：'+name;
  document.getElementById('resume-meta').textContent='进度 '+fmtTime(prog.time)+(prog.duration? ' / '+fmtTime(prog.duration):'')+(when? '（上次 '+when+'）':'');
  document.getElementById('resume-go').onclick=()=>resumePlay(prog);
  document.getElementById('rb-title').innerHTML='继续播放：'+name+'<small>进度 '+fmtTime(prog.time)+(prog.duration?' / '+fmtTime(prog.duration):'')+(when?' · 上次 '+when:'')+'</small>';
  resumeBar.dataset.prog = JSON.stringify(prog);
  document.getElementById('resume-from-player').style.display='';
  document.getElementById('resume-from-player').onclick=()=>resumePlay(prog);
  updateResumeBar();
}
function updateResumeBar(){
  const has = resumeBar.dataset.prog;
  if(player.style.display==='flex'){ resumeBar.style.display='none'; return; }
  resumeBar.style.display = has ? 'flex' : 'none';
}
function resumePlay(prog){
  resumeBar.style.display='none';
  if(prog.playlist && prog.playlist.length){
    playlist = prog.playlist.map(i=>BOOKS[i]).filter(Boolean);
    playingAll=true; plIndex=prog.index>=0?prog.index:0;
    document.getElementById('play-all').style.display='none';
    document.getElementById('stop-all').style.display='';
    currentPlay={file:playlist[plIndex].file,name:playlist[plIndex].title,text:playlist[plIndex].text,playlist,index:plIndex};
    playBook(playlist[plIndex], prog.time);
  }else{
    currentPlay={file:prog.file,name:prog.name,text:prog.text,playlist:null,index:-1};
    playBook({file:prog.file,name:prog.name,text:prog.text}, prog.time);
  }
}

function splitSentences(text){
  if(!text) return [];
  const seps = '。！？；…\n';
  let out=[], cur='';
  for(const ch of text){ cur+=ch; if(seps.includes(ch)){ out.push(cur.trim()); cur=''; } }
  if(cur.trim()) out.push(cur.trim());
  return out.filter(s=>s.length);
}
function buildTimeline(sentences, duration){
  const total = sentences.reduce((a,s)=>a+s.length,0) || 1;
  let acc=0; const marks=[];
  for(const s of sentences){ const start=(acc/total)*duration; acc+=s.length; marks.push([start,(acc/total)*duration]); }
  return marks;
}
function renderSubtitle(text){
  curSentences = splitSentences(text); curMarks=null; curActive=-1;
  if(!curSentences.length){ subtitleEl.style.display='none'; subtitleEl.innerHTML=''; return; }
  subtitleEl.style.display='block'; subtitleEl.innerHTML='';
  curSentences.forEach((s,i)=>{
    const span=document.createElement('span'); span.className='sent'; span.textContent=s; span.dataset.i=i;
    span.onclick=()=>{ if(curMarks&&curMarks[i]){ audio.currentTime=curMarks[i][0]; audio.play().catch(()=>{}); } };
    subtitleEl.appendChild(span);
  });
  highlight(-1);
}
function highlight(i){
  if(i===curActive) return;
  const els=subtitleEl.children;
  if(curActive>=0 && els[curActive]) els[curActive].classList.remove('active');
  curActive=i;
  if(i>=0 && els[i]){ els[i].classList.add('active'); els[i].scrollIntoView({block:'center',behavior:'smooth'}); }
}
function playBook(b, startTime){
  startTime = startTime || 0;
  const src = b.file || b.audio || b.url;     // 流式版用 .file（音频 URL）
  const nm = b.title || b.name;
  playingAll = playingAll && playlist.length > 0;
  currentPlay = { file:src, name:nm, text:b.text, playlist: playingAll?playlist:null, index: playingAll?plIndex:-1 };
  player.style.display='flex'; resumeBar.style.display='none';
  playerNow.textContent=nm;
  audio.src=src; renderSubtitle(b.text); applySpeed();   // 设置 src 后按需加载该篇音频
  const seekPlay=()=>{ try{ if(startTime>0) audio.currentTime=startTime; }catch(e){} audio.play().catch(()=>{}); };
  // preload=none 时仅设置 src 不会发起网络请求，必须主动 play() 触发流式加载（否则 loadedmetadata 永不触发，死锁）
  audio.play().catch(()=>{});   // 主动触发流式加载（数据 URI / 远程音频均通用）
  if(audio.readyState>=1) seekPlay(); else audio.addEventListener('loadedmetadata', seekPlay, {once:true});
  if(audio.readyState>=1) seekPlay(); else audio.addEventListener('loadedmetadata', seekPlay, {once:true});
  saveProgress();
}
audio.addEventListener('loadedmetadata', ()=>{ curMarks=null; });
audio.addEventListener('timeupdate', ()=>{
  if(!curSentences.length) return;
  if(!curMarks && audio.duration) curMarks=buildTimeline(curSentences, audio.duration);
  if(curMarks){
    const t=audio.currentTime; let idx=-1;
    for(let i=0;i<curMarks.length;i++){ if(t>=curMarks[i][0]&&t<curMarks[i][1]){ idx=i; break; } }
    if(idx===-1 && t>=audio.duration) idx=curMarks.length-1;
    highlight(idx);
  }
  const now=Date.now();
  if(now-lastSave>3000 && currentPlay.file){ lastSave=now; saveProgress(); }
});
audio.addEventListener('pause', ()=>{ saveProgress(); updateResumeBar(); });
audio.addEventListener('ended', ()=>{
  if(playingAll && plIndex<playlist.length-1){ playItem(plIndex+1); return; }
  clearProgress();
  resumeBar.dataset.prog=''; showResume(null);
  if(playingAll){
    playingAll=false;
    document.getElementById('play-all').style.display='';
    document.getElementById('stop-all').style.display='none';
    document.getElementById('playing-all-status').textContent='已全部播放完毕 ✓';
  }
  document.querySelectorAll('#list .card.playing').forEach(c=>c.classList.remove('playing'));
});

function playItem(i){
  if(i<0||i>=playlist.length) return;
  plIndex=i; const b=playlist[i];
  document.querySelectorAll('#list .card').forEach((c,j)=>{
    c.classList.toggle('playing', BOOKS[j] && BOOKS[j].title===b.title);
  });
  document.getElementById('playing-all-status').textContent=`正在播放 ${i+1}/${playlist.length}：${b.title}`;
  playBook(b, 0);
}
function playAll(){
  playlist=BOOKS.slice(); playingAll=true; plIndex=0;
  document.getElementById('play-all').style.display='none';
  document.getElementById('stop-all').style.display='';
  playItem(0);
}
function stopAll(){
  playingAll=false; playlist=[]; plIndex=-1; audio.pause();
  document.getElementById('play-all').style.display='';
  document.getElementById('stop-all').style.display='none';
  document.getElementById('playing-all-status').textContent='';
  document.querySelectorAll('#list .card.playing').forEach(c=>c.classList.remove('playing'));
}
document.getElementById('play-all').onclick=playAll;
document.getElementById('stop-all').onclick=stopAll;

document.getElementById('speed').onchange = applySpeed;
document.getElementById('timer').onchange = e => setSleep(parseInt(e.target.value,10)||0);
document.getElementById('rb-go').onclick = ()=>{ const p=resumeBar.dataset.prog; if(p) resumePlay(JSON.parse(p)); };
document.getElementById('rb-close').onclick = ()=>{ resumeBar.style.display='none'; };
window.addEventListener('beforeunload', saveProgress);

BOOKS.forEach((b,i)=>{
  const card=document.createElement('div'); card.className='card';
  const dl = document.createElement('a');
  dl.className='badge'; dl.textContent='⬇ MP3'; dl.href=b.file; dl.setAttribute('download', b.title+'.mp3');
  card.innerHTML=`
    <div class="row">
      <div><div class="title">${i+1}. ${b.title}</div><div class="meta">时长 ${b.duration} 秒</div></div>
      <div style="display:flex;align-items:center">
        <button class="play-btn">▶ 播放</button>
      </div>
    </div>`;
  card.querySelector('.play-btn').insertAdjacentElement('afterend', dl);
  card.querySelector('.play-btn').onclick=()=>{ stopAll(); card.classList.add('playing'); playBook(b, 0); };
  listEl.appendChild(card);
});

try{ const sv = localStorage.getItem(SPEED_KEY); if(sv) document.getElementById('speed').value = sv; }catch(e){}
loadProgress().then(showResume);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ loadProgress().then(showResume); } });
</script>
</body>
</html>
